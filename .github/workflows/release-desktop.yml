name: release-desktop

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new v* release tag
        required: true
        default: v0.1.0
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tauri_args: ""
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            tauri_args: ""
          - runner: macos-latest
            target: aarch64-apple-darwin
            tauri_args: "--target aarch64-apple-darwin"
          - runner: macos-latest
            target: x86_64-apple-darwin
            tauri_args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux desktop dependencies
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: swatinem/rust-cache@v2
      - run: npm ci
      - name: Build sandbox sidecar
        run: cargo build --release --locked --bin mai-sandbox --target ${{ matrix.target }}
        working-directory: crates/mai-rust
      - name: Build Node sidecars
        run: npm run package:sidecars -w mai-cli -- --target-triple ${{ matrix.target }}
      - name: Build installers and attach release assets
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          releaseName: "Mai ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: "Cross-platform Mai release."
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.tauri_args }}
