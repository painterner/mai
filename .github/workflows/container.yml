name: publish-container

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out Node API
        uses: actions/checkout@v7
        with:
          path: workspace/mai-cli-node

      - name: Check out Rust sandbox
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.MAI_RUST_REPOSITORY }}
          token: ${{ secrets.MAI_SOURCE_TOKEN || github.token }}
          path: workspace/mail-cli-rust

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and publish full-featured API image
        uses: docker/build-push-action@v6
        with:
          context: workspace/mai-cli-node
          file: workspace/mai-cli-node/Dockerfile
          build-contexts: |
            sandbox-src=workspace/mail-cli-rust
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
