[package]
name = "gemini-cli"
version = "0.1.0"
edition = "2024"
description = "A fast Gemini CLI built with Rust + Ratatui"
license = "MIT"

[[bin]]
name = "gemini"
path = "src/main.rs"

[dependencies]
# TUI
ratatui = { version = "0.29", features = ["crossterm"] }
crossterm = { version = "0.28", features = ["event-stream"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"

# HTTP & API
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
reqwest-eventsource = "0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI arguments
clap = { version = "4", features = ["derive"] }

# Config
dirs = "6"
toml = "0.8"

# Markdown rendering
pulldown-cmark = "0.12"

# Syntax highlighting
syntect = { version = "5", default-features = false, features = ["default-fancy"] }

# Logging & error handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"

# Misc
chrono = "0.4"
unicode-width = "0.2"
textwrap = "0.16"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
